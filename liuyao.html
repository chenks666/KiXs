  <link rel="stylesheet" href="../base.css">
  <style>
    .yao-log { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
    .yao-slot {
      width: 62px; height: 62px; border-radius: 50%;
      display: grid; place-items: center;
      border: 1px solid var(--line); background: var(--bg-2);
      font-family: "STKaiti","KaiTi",serif; font-size: 16px; color: var(--ink-3);
      transition: all 0.4s;
    }
    .yao-slot.done { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 14px var(--glow); }
    .yao-slot.done.old { border-color: var(--danger); color: var(--danger); }
    .yao-coins { text-align: center; min-height: 70px; padding: 8px 0; }
    .coin {
      display: inline-grid; place-items: center; width: 46px; height: 46px;
      border-radius: 50%; margin: 0 6px;
      background: radial-gradient(circle at 35% 30%, #d9c79a, #9c8544);
      color: #4a3a10; font-size: 15px; font-weight: 700;
      box-shadow: 0 3px 8px rgba(0,0,0,.5), inset 0 0 0 3px rgba(255,255,255,.18);
      animation: coinToss 0.5s ease;
    }
    @keyframes coinToss { 0% { transform: translateY(-14px) rotate(-160deg); opacity: 0;} 100% { transform: none; opacity: 1;} }
    .toss-msg { margin-top: 10px; font-family: "STKaiti","KaiTi",serif; font-size: 16px; color: var(--accent); letter-spacing: 3px; }
    .duo { display: flex; gap: 44px; justify-content: center; flex-wrap: wrap; padding: 18px 0; }
    .duo .gua-unit { text-align: center; }
    .duo .g-tag { font-size: 11px; letter-spacing: 3px; color: var(--ink-3); margin-bottom: 8px; }
    .duo .g-name { font-family: "STKaiti","KaiTi",serif; font-size: 19px; letter-spacing: 3px; margin-bottom: 12px; }
  </style>
</head>

  <section class="hero">
    <div class="kicker">Liuyao · 占术</div>
    <h1>六爻卦</h1>
    <p class="sub">三枚铜钱，六掷成卦。默念所问，亲手摇之：老阴老阳为动，少阳少阴为静，本变两卦，吉凶自见。</p>
  </section>

  <main class="wrap">
    <div class="reading">
      <div class="label">请卦 · 默念所问 · 亲手摇六次</div>
      <div class="form-row">
        <label>心中所问</label>
        <input class="input" id="question" placeholder="例如：这次合作能否顺利推进？">
      </div>
      <div class="yao-coins" id="coin-box"><span style="color:var(--ink-3);font-size:13px;">点击按钮，依次摇卦六次</span></div>
      <div class="yao-log" id="yao-log"></div>
      <div style="text-align:center;margin-top:20px;display:flex;gap:14px;justify-content:center;flex-wrap:wrap;">
        <button class="btn" id="btn-toss">掷铜钱 · 第 1 次</button>
        <button class="btn ghost" id="btn-reset">重新摇卦</button>
      </div>
    </div>

    <div id="result" style="display:none;"></div>
  </main>

  <div class="disclaimer">⚠️ 本回复由 AI 生成，六爻为传统数术的象征推演，<b>仅供娱乐参考</b>。当前为简化演示版（未装完整纳甲六亲六神），精算版引擎接入中。不构成医疗、法律、财务或投资建议。</div>

  <footer class="footer">KiXs · 六爻 — 卦由心起 · 爻随念动</footer>

  <script src="../tone-engine.js"></script>
  <script src="../hexagram-data.js"></script>
  <script src="../liuyao.js"></script>
  <script>
    let tosses = [];
    const slots = document.getElementById('yao-log');
    const coinBox = document.getElementById('coin-box');
    const btn = document.getElementById('btn-toss');
    const btnReset = document.getElementById('btn-reset');

    function renderSlots() {
      slots.innerHTML = tosses.map((t, i) => {
        const mark = t.moving ? (t.yin ? '×' : '○') : (t.yin ? '、、' : '、');
        return `<div class="yao-slot ${t ? (t.moving ? 'done old' : 'done') : ''}">${i + 1}<br><span style="font-size:13px;">${t ? mark : ''}</span></div>`;
      }).join('');
    }

    btn.onclick = () => {
      const t = LiuyaoEngine.tossCoin();
      tosses.push(t);
      // 铜钱展示（tossCoin 内部是随机的，这里展示的是已摇结果：三枚铜钱随机渲染）
      const coins = [0, 1, 2].map(() => (Math.random() < 0.5 ? '字' : '花'));
      coinBox.innerHTML = coins.map((c) => `<span class="coin"><span>${c}</span></span>`).join('') +
        `<div class="toss-msg">第 ${tosses.length} 掷 · ${t.label}</div>`;
      renderSlots();
      if (tosses.length < 6) {
        btn.textContent = `掷铜钱 · 第 ${tosses.length + 1} 次`;
      } else {
        btn.textContent = '卦成 · 看解读';
      }
    };

    btnReset.onclick = () => {
      tosses = [];
      renderSlots();
      coinBox.innerHTML = '<span style="color:var(--ink-3);font-size:13px;">点击按钮，依次摇卦六次</span>';
      btn.textContent = '掷铜钱 · 第 1 次';
      document.getElementById('result').style.display = 'none';
    };

    /* 六次摇满后，按钮第二次点击即成卦 */
    btn.addEventListener('click', function () {
      if (tosses.length === 6) finish();
    });

    function finish() {
      const question = document.getElementById('question').value.trim();
      const result = LiuyaoEngine.cast(tosses);
      AskPanel.setChart({ result });
      const el = document.getElementById('result');
      el.style.display = 'block';
      el.className = 'result-enter';

      const guaHtml = (bits, dongSet) => {
        // bits 自下而上 [0..5]，显示时从上往下
        const seq = [5, 4, 3, 2, 1, 0];
        return `<div class="guagua">${seq.map((i) => {
          const pos = i + 1; // 第几爻
          const dong = dongSet.has(pos);
          if (bits[i] === 1) return `<span class="yao yang ${dong ? 'dong' : ''}"></span>`;
          return `<span class="yao yin ${dong ? 'dong' : ''}"><i></i></span>`;
        }).join('')}</div>`;
      };
      const dongSet = new Set(tosses.map((y, i) => (y.moving ? i + 1 : 0)).filter(Boolean));

      el.innerHTML = `
        <div class="reading">
          <div class="label">卦已成 · 本变对照</div>
          <div class="duo">
            <div class="gua-unit">
              <div class="g-tag">本卦</div>
              <div class="g-name">${result.ben.name}</div>
              ${guaHtml(result.benBits, dongSet)}
            </div>
            ${result.bian
              ? `<div class="gua-unit"><div class="g-tag">变卦</div><div class="g-name">${result.bian.name}</div>${guaHtml(result.bianBits, new Set())}</div>`
              : `<div class="gua-unit"><div class="g-tag">变卦</div><div class="g-name" style="color:var(--ink-3);">无</div><div style="font-size:12px;color:var(--ink-3);padding-top:16px;">六爻皆静</div></div>`}
          </div>
        </div>
        <div class="reading">
          <div class="label">解读</div>
          <div class="txt">${LiuyaoEngine.interpret(result, question).replace(/\n/g, '<br>')}</div>
        </div>
        <div class="summary-box">
          <div class="sum-title">三句点醒</div>
          <ul>${LiuyaoEngine.summarize(result).map((p) => `<li>${p}</li>`).join('')}</ul>
        </div>`;
      el.scrollIntoView({ behavior: 'smooth' });
    }

    ToneEngine.applyBadge();
  </script>
  <script src="../knowledge-base.js"></script>
  <script src="../ask-panel.js"></script>
  <script>AskPanel.init({ system: 'liuyao', hint: '用神是什么' });</script>
<script>
/* 全局错误浮层（开发期调试：任何报错直接可见，避免"没反应/白屏"） */
(function(){
  var shown = false;
  window.addEventListener("error", function(e){
    if (shown) return; shown = true;
    var d = document.createElement("div");
    d.style.cssText = "position:fixed;left:12px;bottom:96px;z-index:99999;max-width:520px;max-height:60vh;overflow:auto;background:#2a1210;border:1px solid #c44a3c;color:#f2d8d4;font-size:11px;line-height:1.6;padding:10px 14px;border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.5);font-family:monospace;white-space:pre-wrap;word-break:break-all;";
    var stack = (e.error && e.error.stack) ? e.error.stack : "";
        d.textContent = "⚠ 脚本错误：" + (e.message || "unknown") + " | " + (e.filename || "") + ":" + (e.lineno || "") + (e.colno ? (":" + e.colno) : "") + (stack ? (" | " + stack) : "");
        document.body.appendChild(d);
  });
})();
</script>

  <script>
    function openAskPanel() {
      if (window.AskPanel && typeof window.AskPanel.toggle === 'function') {
        window.AskPanel.toggle();
      } else {
        var s = document.createElement('script');
        s.src = '../js/ask-panel.js';
        s.onload = function() { if (window.AskPanel) window.AskPanel.toggle(); };
        document.body.appendChild(s);
      }
    }
    // 高亮当前页 tab
    (function(){
      try {
        var path = location.pathname;
        var fileName = path.split('/').pop();
        var tabs = document.querySelectorAll('#bottom-tab .tab-item');
        tabs.forEach(function(a){
          if (a.href && fileName && a.href.indexOf(fileName) >= 0) {
            tabs.forEach(function(x){ x.classList.remove('active'); });
            a.classList.add('active');
          }
        });
      } catch(e) {}
    })();
  </script>


  <script>
    function openTopbarMentor(system) {
      if (window.AskPanel && typeof window.AskPanel.open === 'function') {
        window.AskPanel.open(system);
      } else {
        var s = document.createElement('script');
        s.src = '../js/ask-panel.js';
        s.onload = function() { if (window.AskPanel) window.AskPanel.open(system); };
        document.body.appendChild(s);
      }
    }
    function renderTopbarAvatars() {
      if (!window.AskPanel || !window.AskPanel._avatarSvg) return;
      var w = document.getElementById('tb-avatar-w');
      var e = document.getElementById('tb-avatar-e');
      if (w) w.innerHTML = window.AskPanel._avatarSvg('astrology');
      if (e) e.innerHTML = window.AskPanel._avatarSvg('bazi');
    }
    if (window.AskPanel) renderTopbarAvatars();
    window.addEventListener('load', renderTopbarAvatars);
  </script>
