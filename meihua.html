  <link rel="stylesheet" href="base.css">
  <style>
    body { background-image: radial-gradient(circle at 15% 20%, rgba(104,144,168,.06), transparent 40%); }
    .num-input { display: flex; gap: 20px; justify-content: center; align-items: flex-end; flex-wrap: wrap; }
    .num-input .field { text-align: center; }
    .num-input input {
      width: 90px; height: 90px; text-align: center; font-size: 32px;
      font-family: "STKaiti","KaiTi",serif; border-radius: 50%;
      border: 1.5px solid var(--line); background: var(--panel);
      color: var(--ink); outline: none;
    }
    .num-input input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--glow); }
    .num-input .tip { font-size: 12px; color: var(--ink-3); margin-top: 8px; }
    .gua-duo { display: flex; gap: 34px; justify-content: center; flex-wrap: wrap; padding: 18px 0; }
    .gua-unit { text-align: center; min-width: 110px; }
    .gua-unit .g-name { font-family: "STKaiti","KaiTi",serif; font-size: 17px; letter-spacing: 2px; margin-bottom: 10px; }
    .gua-unit .g-tag { font-size: 11px; color: var(--ink-3); margin-bottom: 10px; letter-spacing: 2px; }
    .guagua { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .guagua .yao { display: block; }
    .guagua .yao.yang { width: 60px; height: 9px; background: var(--ink); border-radius: 1px; }
    .guagua .yao.yin { width: 60px; height: 9px; display: flex; gap: 12px; }
    .guagua .yao.yin i { flex: 1; background: var(--ink); border-radius: 1px; }
    .tiguang { margin-top: 16px; display: inline-flex; gap: 18px; font-size: 13px; color: var(--ink-2); }
    .tiguang b { color: var(--accent-2); }
    .level-tag { display: inline-block; padding: 3px 14px; border-radius: 999px; font-size: 13px; margin-bottom: 10px; }
    .level-tag.lv-ji { color: #b8341e; border: 1px solid #b8341e; }
    .level-tag.lv-zhong { color: #8a6c3a; border: 1px solid #8a6c3a; }
    .level-tag.lv-xiong { color: #6d6a94; border: 1px solid #6d6a94; }
  </style>
</head>
<body class="grain">

    <!-- 顶栏师傅：玄机子（中国体系） -->
    <div class="topbar-mentors" id="topbar-mentors">
      <div class="tb-mentor east" onclick="openTopbarMentor('bazi')" title="玄机子 · 玄学大师">

    </div>
    <nav class="nav">

  <section class="hero">
    <div class="kicker">Meihua Yijing · 占术</div>
    <h1>梅花易数</h1>
    <p class="sub">观梅之数，以三数成卦。静心默念所问，报出三个数字（1–9），体用立判，本互变三卦之机尽显。</p>
  </section>

  <main class="wrap">
    <div class="reading">
      <div class="label">请卦 · 默念所问 · 报三数</div>
      <div class="form-row">
        <label>心中所问</label>
        <input class="input" id="question" placeholder="例如：近期搬家是否顺利？">
      </div>
      <div class="num-input">
        <div class="field"><input id="n1" type="number" min="1" max="9" value=""><div class="tip">上卦之数</div></div>
        <div class="field"><input id="n2" type="number" min="1" max="9" value=""><div class="tip">下卦之数</div></div>
        <div class="field"><input id="n3" type="number" min="1" max="9" value=""><div class="tip">动爻之数</div></div>
      </div>
      <div style="text-align:center;margin-top:22px;">
        <button class="btn" id="btn-cast">起卦</button>
      </div>
    </div>

    <div id="result" style="display:none;"></div>
  </main>

  <div class="disclaimer">⚠️ 本回复由 AI 生成，梅花易数为传统数术的象征推演，<b>仅供娱乐参考</b>，不构成医疗、法律、财务或投资建议。重大决策请咨询相应专业人士。</div>

  <footer class="footer">KiXs · 梅花易数 — 数由心生 · 卦随念动</footer>

  <script src="tone-engine.js"></script>
  <script src="hexagram-data.js"></script>
  <script src="meihua.js"></script>
  <script>
    /* 渲染卦象（lines 从下往上） */
    function guaHtml(lines, dongYao) {
      return `<div class="guagua">${lines.slice().reverse().map((l, i) => {
        const pos = lines.length - i; // 从下数第几爻
        const dong = dongYao && dongYao.indexOf(pos) !== -1;
        if (l === 1) return `<span class="yao yang ${dong ? 'dong' : ''}"></span>`;
        return `<span class="yao yin ${dong ? 'dong' : ''}"><i></i></span>`;
      }).join('')}</div>`;
    }

    document.getElementById('btn-cast').onclick = () => {
      const n1 = parseInt(document.getElementById('n1').value, 10);
      const n2 = parseInt(document.getElementById('n2').value, 10);
      const n3 = parseInt(document.getElementById('n3').value, 10);
      if (!n1 || !n2 || !n3 || n1 < 1 || n1 > 9 || n2 < 1 || n2 > 9 || n3 < 1 || n3 > 9) {
        alert('请依次报出三个 1–9 的数字（占术请由问事者亲自报数）。');
        return;
      }
      const question = document.getElementById('question').value.trim();
      const r = MeihuaEngine.cast(n1, n2, n3);
      AskPanel.setChart({ result: r });
      const levelCls = r.level === '吉' ? 'lv-ji' : (r.level === '凶' ? 'lv-xiong' : 'lv-zhong');
      const el = document.getElementById('result');
      el.style.display = 'block';
      el.className = 'result-enter';
      el.innerHTML = `
        <div class="reading">
          <div class="label">卦已成 · 本互变</div>
          <div class="gua-duo">
            <div class="gua-unit">
              <div class="g-tag">本卦 · 事之当下</div>
              <div class="g-name">${r.ben.name}</div>
              ${guaHtml(r.ben.lines, [r.moving])}
            </div>
            <div class="gua-unit">
              <div class="g-tag">互卦 · 事之过程</div>
              <div class="g-name">${r.hu.name}</div>
              ${guaHtml([...r.hu.lower.lines, ...r.hu.upper.lines])}
            </div>
            <div class="gua-unit">
              <div class="g-tag">变卦 · 事之终局</div>
              <div class="g-name">${r.bian.name}</div>
              ${guaHtml(r.bian.lines)}
            </div>
          </div>
          <div style="text-align:center;">
            <span class="level-tag ${levelCls}">${r.relation} · ${r.level}</span>
            <div class="tiguang">体卦 <b>${r.ti.name}${r.ti.symbol}（${r.tiEl}）</b> ↔ 用卦 <b>${r.yong.name}${r.yong.symbol}（${r.yongEl}）</b> · 动爻第${r.moving}爻</div>
          </div>
        </div>
        <div class="reading">
          <div class="label">解读</div>
          <div class="txt">${MeihuaEngine.interpret(r, question).replace(/\n/g, '<br>')}</div>
        </div>
        <div class="summary-box">
          <div class="sum-title">三句点醒</div>
          <ul>${MeihuaEngine.summarize(r).map((p) => `<li>${p}</li>`).join('')}</ul>
        </div>`;
      el.scrollIntoView({ behavior: 'smooth' });
    };

    ToneEngine.applyBadge();
  </script>
  <script src="knowledge-base.js"></script>
  <script src="ask-panel.js"></script>
  <script>AskPanel.init({ system: 'meihua', hint: '体用是什么' });</script>
<script>
/* 全局错误浮层（开发期调试：任何报错直接可见，避免"没反应/白屏"） */
(function(){
  var shown = false;
  window.addEventListener("error", function(e){
    if (shown) return; shown = true;
    var d = document.createElement("div");
    d.style.cssText = "position:fixed;left:12px;bottom:96px;z-index:99999;max-width:520px;max-height:60vh;overflow:auto;background:#2a1210;border:1px solid #c44a3c;color:#f2d8d4;font-size:11px;line-height:1.6;padding:10px 14px;border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.5);font-family:monospace;white-space:pre-wrap;word-break:break-all;";
    var stack = (e.error && e.error.stack) ? e.error.stack : "";
    d.textContent = "⚠ 脚本错误：" + (e.message || "unknown") + " | " + (e.filename || "") + ":" + (e.lineno || "") + (e.colno ? (":" + e.colno) : "") + (stack ? ("
" + stack) : "");
    document.body.appendChild(d);
  });
})();
</script>

  <script>
    function openAskPanel() {
      if (window.AskPanel && typeof window.AskPanel.toggle === 'function') {
        window.AskPanel.toggle();
      } else {
        var s = document.createElement('script');
        s.src = '../js/ask-panel.js';
        s.onload = function() { if (window.AskPanel) window.AskPanel.toggle(); };
        document.body.appendChild(s);
      }
    }
    // 高亮当前页 tab
    (function(){
      try {
        var path = location.pathname;
        var fileName = path.split('/').pop();
        var tabs = document.querySelectorAll('#bottom-tab .tab-item');
        tabs.forEach(function(a){
          if (a.href && fileName && a.href.indexOf(fileName) >= 0) {
            tabs.forEach(function(x){ x.classList.remove('active'); });
            a.classList.add('active');
          }
        });
      } catch(e) {}
    })();
  </script>


  <script>
    function openTopbarMentor(system) {
      if (window.AskPanel && typeof window.AskPanel.open === 'function') {
        window.AskPanel.open(system);
      } else {
        var s = document.createElement('script');
        s.src = '../js/ask-panel.js';
        s.onload = function() { if (window.AskPanel) window.AskPanel.open(system); };
        document.body.appendChild(s);
      }
    }
    function renderTopbarAvatars() {
      if (!window.AskPanel || !window.AskPanel._avatarSvg) return;
      var w = document.getElementById('tb-avatar-w');
      var e = document.getElementById('tb-avatar-e');
      if (w) w.innerHTML = window.AskPanel._avatarSvg('astrology');
      if (e) e.innerHTML = window.AskPanel._avatarSvg('bazi');
    }
    if (window.AskPanel) renderTopbarAvatars();
    window.addEventListener('load', renderTopbarAvatars);
  </script>
