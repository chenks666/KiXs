<!DOCTYPE html>
<html lang="zh-CN" data-theme="bazi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23110d18'/><text x='32' y='45' font-size='40' font-weight='800' text-anchor='middle' fill='%23d4af6e' font-family='Arial, sans-serif'>K</text></svg>">
  <title>八字命理 — KiXs · 命术</title>
  <link rel="stylesheet" href="../css/base.css">
  <style>
    .wu-legend { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; font-size: 12px; color: var(--ink-3); margin-top: 8px; }
    .strength-box { margin-top: 16px; padding: 14px 18px; border-radius: 12px; background: var(--bg-2); border: 1px solid var(--line); font-size: 13px; color: var(--ink-2); }
    .flow-row { display: flex; gap: 12px; flex-wrap: wrap; }
    .flow-item { flex: 1; min-width: 150px; padding: 14px; border-radius: 12px; background: var(--bg-2); border: 1px solid var(--line); text-align: center; }
    .flow-item .y { font-size: 12px; color: var(--ink-3); letter-spacing: 2px; }
    .flow-item .gz { font-family: "STKaiti","KaiTi",serif; font-size: 22px; color: var(--accent); margin: 6px 0; }
    .flow-item .rel { font-size: 12px; color: var(--ink-2); }
    /* 大运时间轴 */
    .dayun-row { display: flex; gap: 8px; overflow-x: auto; padding: 6px 2px 12px; }
    .dayun-item {
      min-width: 96px; flex: 1; text-align: center; position: relative;
      padding: 12px 6px; border-radius: 12px; border: 1px solid var(--line);
      background: var(--bg-2); opacity: 0.55; transition: all 0.25s;
    }
    .dayun-item.past { opacity: 0.35; }
    .dayun-item.cur {
      opacity: 1; border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--bg-2));
      box-shadow: 0 0 18px var(--glow);
    }
    .dayun-item .du-age { font-size: 11px; color: var(--ink-3); letter-spacing: 1px; }
    .dayun-item .du-gz { font-family: "STKaiti","KaiTi",serif; font-size: 20px; color: var(--ink); margin: 5px 0; }
    .dayun-item.cur .du-gz { color: var(--accent); }
    .dayun-item .du-wu { width: 26px; height: 4px; border-radius: 99px; margin: 4px auto 0; }
    .dayun-item .du-now { font-size: 10px; color: var(--accent); margin-top: 4px; letter-spacing: 2px; }
    .wu-jin { background: #f3d99c; } .wu-mu { background: #8ec27a; } .wu-shui { background: #6ea8d8; } .wu-huo { background: #e08a7a; } .wu-tu { background: #d9b45a; }
    /* 四柱盘增强（问真风格：藏干+十神分层） */
    .pillar { display: flex; flex-direction: column; justify-content: flex-start; }
    .pillar .p-shishen { font-size: 11px; color: var(--accent); letter-spacing: 2px; margin-bottom: 4px; min-height: 16px; }
    .pillar .p-ganzhi { font-family: "STKaiti","KaiTi",serif; font-size: 26px; letter-spacing: 4px; color: var(--ink); margin: 2px 0 8px; }
    .pillar .p-zang { font-size: 11px; color: var(--ink-2); line-height: 1.7; }
    .pillar .p-zang i { font-style: normal; color: var(--ink-3); }
    .pillar .p-wu-line { display: flex; justify-content: center; gap: 5px; margin-top: 8px; }
    /* 逐年流年横排 */
    .liunian-row { display: flex; gap: 7px; overflow-x: auto; padding: 8px 2px 14px; }
    .ln-item {
      min-width: 82px; flex: 1; text-align: center; cursor: pointer;
      padding: 10px 4px; border-radius: 12px; border: 1px solid var(--line);
      background: var(--bg-2); transition: all 0.25s; position: relative;
    }
    .ln-item:hover { border-color: var(--accent-2); }
    .ln-item .ln-y { font-size: 11px; color: var(--ink-3); }
    .ln-item .ln-gz { font-family: "STKaiti","KaiTi",serif; font-size: 21px; color: var(--ink); margin: 3px 0; }
    .ln-item .ln-shen { font-size: 10.5px; color: var(--ink-2); }
    .ln-item.sel {
      border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--bg-2));
      box-shadow: 0 0 16px var(--glow);
    }
    .ln-item.sel .ln-gz { color: var(--accent); }
    .ln-item.this-year::after {
      content: "今年"; position: absolute; top: -7px; right: 6px;
      font-size: 9px; color: var(--bg); background: var(--accent); border-radius: 6px; padding: 1px 5px;
    }
    /* 流年详批卡 */
    .detail-card {
      margin-top: 14px; padding: 18px 20px; border-radius: 14px;
      border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent);
      background: color-mix(in srgb, var(--accent) 5%, var(--bg-2));
      animation: resultIn 0.4s ease both;
    }
    .detail-card .dc-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
    .detail-card .dc-gz { font-family: "STKaiti","KaiTi",serif; font-size: 30px; letter-spacing: 3px; color: var(--accent); }
    .detail-card .dc-meta { font-size: 12px; color: var(--ink-2); }
    .detail-card .ss-chip {
      display: inline-block; font-size: 11px; padding: 2px 10px; border-radius: 99px;
      border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); color: var(--accent);
      margin: 0 6px 4px 0;
    }
    .detail-card .dc-line { font-size: 13.5px; color: var(--ink); line-height: 1.9; margin-top: 8px; padding-left: 12px; position: relative; }
    .detail-card .dc-line::before { content: "·"; position: absolute; left: 0; color: var(--accent); }
    .detail-card .dc-line b { color: var(--accent); font-weight: 600; }
    /* 五维曲线 */
    .chart-svg-wrap { width: 100%; max-width: 760px; margin: 6px auto 0; }
    .chart-legend { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; font-size: 11px; color: var(--ink-3); margin-top: 8px; }
    .chart-legend span { display: inline-flex; align-items: center; gap: 5px; }
    .chart-legend i { width: 16px; height: 3px; border-radius: 99px; display: inline-block; }
  </style>
</head>

  <section class="hero">
    <div class="kicker">BaZi · 命术</div>
    <h1>八字命理</h1>
    <p class="sub">四柱干支，五行生克。以出生年月日时起盘，观先天格局与流年起伏。日柱为精确历法计算，年柱月柱以节气近似定界。</p>
    <div class="meta-line" style="color:var(--danger);">精度说明：日柱/时柱为精确算法；年柱月柱依节气近似（±1 日），边界时辰请以专业万年历复核</div>
  </section>

  <main class="wrap">
    <div class="reading">
      <div class="label">起盘 · 出生信息</div>
      <div class="form-grid">
        <div class="form-row">
          <label>出生日期（公历）</label>
          <input class="input" type="date" id="birth-date" max="2099-12-31">
        </div>
        <div class="form-row">
          <label>出生时辰</label>
          <select class="input" id="shichen">
            <option value="">— 请选择时辰 —</option>
            <option value="子">子时 23:00–01:00</option>
            <option value="丑">丑时 01:00–03:00</option>
            <option value="寅">寅时 03:00–05:00</option>
            <option value="卯">卯时 05:00–07:00</option>
            <option value="辰">辰时 07:00–09:00</option>
            <option value="巳">巳时 09:00–11:00</option>
            <option value="午">午时 11:00–13:00</option>
            <option value="未">未时 13:00–15:00</option>
            <option value="申">申时 15:00–17:00</option>
            <option value="酉">酉时 17:00–19:00</option>
            <option value="戌">戌时 19:00–21:00</option>
            <option value="亥">亥时 21:00–23:00</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <label>性别</label>
        <div class="gender-pick">
          <div class="gender-opt sel" data-g="男" onclick="pickGender(this)">乾造 · 男</div>
          <div class="gender-opt" data-g="女" onclick="pickGender(this)">坤造 · 女</div>
        </div>
      </div>
      <div style="text-align:center;">
        <button class="btn" id="btn-cast">起盘排八字</button>
      </div>
    </div>

    <div id="result" style="display:none;"></div>
  </main>

  <div class="disclaimer">⚠️ 本回复由 AI 生成，八字为传统命理的象征推演，<b>仅供娱乐参考</b>。年柱月柱节气为近似推算（±1 日），重要命理用途请以专业万年历精确排盘为准。不构成医疗、法律、财务或投资建议。</div>

  <footer class="footer">KiXs · 八字 — 知命不认命 · 顺势而为</footer>

  <script src="../js/tone-engine.js"></script>
  <script src="../js/bazi.js"></script>
  <script>
    const GAN = BaZiEngine.GAN, ZHI = BaZiEngine.ZHI;
    const WU_CLS = { 木: 'wu-mu', 火: 'wu-huo', 土: 'wu-tu', 金: 'wu-jin', 水: 'wu-shui' };
    let gender = '男';

    function pickGender(el) {
      gender = el.dataset.g;
      document.querySelectorAll('.gender-opt').forEach((e) => e.classList.toggle('sel', e === el));
    }

    document.getElementById('btn-cast').onclick = () => {
      const dateVal = document.getElementById('birth-date').value;
      const sc = document.getElementById('shichen').value;
      if (!dateVal || !sc) { alert('请先填写出生日期与时辰（命术需完整年月日时方可定盘）。'); return; }
      const d = new Date(dateVal + 'T12:00:00');
      const r = BaZiEngine.cast(d, sc);
      const st = BaZiEngine.strength(r.pillars);
      const HOUR_OF = { 子: 23, 丑: 1, 寅: 3, 卯: 5, 辰: 7, 巳: 9, 午: 11, 未: 13, 申: 15, 酉: 17, 戌: 19, 亥: 21 };
      const dy = BaZiEngine.dayun(r, d, HOUR_OF[sc], gender);
      AskPanel.setChart({ r, dy });
      const today = new Date();
      const el = document.getElementById('result');
      el.style.display = 'block';
      el.className = 'result-enter';

      el.innerHTML = `
        <div class="reading">
          <div class="label">${gender === '男' ? '乾造' : '坤造'} · ${r.birthText}</div>
          <div class="pillar-table">
            ${r.pillars.map((p) => {
              const zang = BaZiEngine.ZANG_GAN[p.zhi];
              return `<div class="pillar">
                <div class="p-name">${p.name}</div>
                <div class="p-shishen">${BaZiEngine.shishen(r.dayMaster, p.gan)}</div>
                <div class="p-ganzhi">${p.gan}${p.zhi}</div>
                <div class="p-zang">藏 <i>${zang.map((zg) => `${zg}${BaZiEngine.shishen(r.dayMaster, zg)}`).join(' ')}</i></div>
                <div class="p-wu-line">
                  <span class="wu-dot ${WU_CLS[BaZiEngine.GAN_WU[p.gan]]}" title="天干${p.gan} ${BaZiEngine.GAN_WU[p.gan]}">${p.gan}</span>
                  <span class="wu-dot ${WU_CLS[BaZiEngine.ZHI_WU[p.zhi]]}" title="地支${p.zhi} ${BaZiEngine.ZHI_WU[p.zhi]}">${p.zhi}</span>
                </div>
              </div>`;
            }).join('')}
          </div>
          <div class="wu-legend">五行分布：
            ${Object.entries(r.wuCount).map(([w, c]) => `<span><b style="color:var(--accent)">${w}</b> ${c}</span>`).join('　')}
          </div>
          <div class="strength-box">
            日主 <b style="color:var(--accent)">${r.dayMaster}${r.dayMasterWu}</b> · ${st.strong ? '身旺（喜克泄，宜用财官）' : '身弱（喜生扶，宜用印比）'} · 月令 ${r.monthZhi}
          </div>
        </div>
        <div class="reading">
          <div class="label">大运 · 十年一运（起运 ${dy.qiYun} 岁 · ${dy.forward}）</div>
          <div class="dayun-row">
            ${dy.yuns.map((u) => {
              const now = (today.getTime() - d.getTime()) / (365.2422 * 86400000);
              const endAge = u.startAge + 9;
              const isPast = endAge < now, isCur = now >= u.startAge && now <= endAge;
              return `<div class="dayun-item ${isPast ? 'past' : ''} ${isCur ? 'cur' : ''}" title="${u.gz}（${u.wu}）运">
                <div class="du-age">${u.startAge}–${endAge}岁</div>
                <div class="du-gz">${u.gz}</div>
                <div class="du-wu wu-${u.wu}"></div>
                ${isCur ? '<div class="du-now">现在</div>' : ''}
              </div>`;
            }).join('')}
          </div>
          <div style="font-size:11px;color:var(--ink-3);margin-top:8px;">灰=已走过 · 金=当前大运 · 亮=未来 —— 大运以「节」定起运，三日折一岁，每运十年。</div>
        </div>
        <div class="reading">
          <div class="label">逐年流年 · 点击某年看详批</div>
          <div class="liunian-row" id="ln-row"></div>
          <div id="ln-detail"></div>
          <div style="font-size:11px;color:var(--ink-3);margin-top:6px;">每一年的干支、十神、神煞与运势起伏——点任意一年，下面展开该年详批。</div>
        </div>
        <div class="reading">
          <div class="label">五年运势曲线 · 事业/财运/感情/健康/学业</div>
          <div class="chart-svg-wrap" id="chart-wrap"></div>
        </div>
        <div class="reading">
          <div class="label">命格解读</div>
          <div class="txt">${BaZiEngine.interpret(r).replace(/\n/g, '<br>')}</div>
        </div>
        <div class="summary-box">
          <div class="sum-title">三句点醒</div>
          <ul>${BaZiEngine.summarize(r, new Date().getFullYear()).map((p) => `<li>${p}</li>`).join('')}</ul>
        </div>`;

      /* 逐年流年数据 + 渲染 */
      const birthYear = d.getFullYear();
      const startYear = new Date().getFullYear();
      const years = Array.from({ length: 12 }, (_, i) => startYear + i);
      window._lnData = years.map((y) => BaZiEngine.liunianDetail(r, y, birthYear, gender, dy));
      renderLnRow();

      /* 渲染曲线 */
      renderChart();

      el.scrollIntoView({ behavior: 'smooth' });
    };

    /* 逐年流年行 */
    function renderLnRow() {
      const row = document.getElementById('ln-row');
      row.innerHTML = window._lnData.map((dd, i) => `
        <div class="ln-item ${i === 0 ? 'this-year' : ''}" data-i="${i}">
          <div class="ln-y">${dd.year}</div>
          <div class="ln-gz">${dd.gz}</div>
          <div class="ln-shen">${dd.shen}</div>
        </div>`).join('');
      row.querySelectorAll('.ln-item').forEach((el) => {
        el.onclick = () => {
          row.querySelectorAll('.ln-item').forEach((x) => x.classList.remove('sel'));
          el.classList.add('sel');
          renderLnDetail(+el.dataset.i);
        };
      });
      renderLnDetail(0);
    }

    /* 流年详批卡 */
    function renderLnDetail(i) {
      const dd = window._lnData[i];
      const el = document.getElementById('ln-detail');
      const ss = dd.shenSha.length ? dd.shenSha.map((s) => `<span class="ss-chip">${s}</span>`).join('') : '<span class="ss-chip" style="opacity:.5">无神煞</span>';
      const sCore = dd.score;
      el.innerHTML = `
        <div class="detail-card">
          <div class="dc-head">
            <span class="dc-gz">${dd.gz}</span>
            <span class="dc-meta">${dd.year} 年 · 天干十神「${dd.shen}」 · 地支藏干 ${dd.zangShen}</span>
          </div>
          <div>${ss}</div>
          <div class="dc-line"><b>主断：</b>${dd.shenLine}</div>
          <div class="dc-line"><b>身强弱：</b>${dd.strengthLine}</div>
          <div class="dc-line"><b>健康：</b>${dd.healthLine}</div>
          <div class="dc-line"><b>大势：</b>${dd.curYun ? '此年行「' + dd.curYun + '」大运之中，大运是基调，流年是这一年的细笔。' : ''}五维评分 —— 事业 ${sCore.career} · 财运 ${sCore.money} · 感情 ${sCore.love} · 健康 ${sCore.health} · 学业 ${sCore.study}。</div>
        </div>`;
      el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    /* 五维运势曲线 */
    function renderChart() {
      const data = window._lnData;
      const dims = [
        { key: 'career', name: '事业', color: '#d4af6e' },
        { key: 'money', name: '财运', color: '#f3d99c' },
        { key: 'love', name: '感情', color: '#e08a7a' },
        { key: 'health', name: '健康', color: '#6b9a5c' },
        { key: 'study', name: '学业', color: '#6ea8d8' },
      ];
      const W = 720, H = 240, padL = 34, padR = 14, padT = 18, padB = 26;
      const iw = W - padL - padR, ih = H - padT - padB;
      const x = (i) => padL + (iw * i) / (data.length - 1);
      const y = (v) => padT + ih - ((v - 10) / 90) * ih;
      const lines = dims.map((dm) => {
        const pts = data.map((dd, i) => `${x(i)},${y(dd.score[dm.key])}`);
        return `<polyline points="${pts.join(' ')}" fill="none" stroke="${dm.color}" stroke-width="2" opacity="0.85"/>
          ${data.map((dd, i) => `<circle cx="${x(i)}" cy="${y(dd.score[dm.key])}" r="2.6" fill="${dm.color}"/>`).join('')}`;
      }).join('');
      const yearsAxis = data.map((dd, i) => `<text x="${x(i)}" y="${H - 8}" font-size="9.5" fill="#6d7aa0" text-anchor="middle">${dd.year}</text>`).join('');
      const gzAxis = data.map((dd, i) => `<text x="${x(i)}" y="${H - 20}" font-size="9" fill="#8a8a9a" text-anchor="middle">${dd.gz}</text>`).join('');
      const grid = [20, 40, 60, 80].map((g) => `<line x1="${padL}" y1="${y(g)}" x2="${W - padR}" y2="${y(g)}" stroke="#2a3a5e" stroke-width="0.6" stroke-dasharray="2 4"/>`).join('');
      document.getElementById('chart-wrap').innerHTML = `
        <svg viewBox="0 0 ${W} ${H}" style="width:100%">
          ${grid}
          ${lines}
          ${yearsAxis}
          ${gzAxis}
        </svg>
        <div class="chart-legend">${dims.map((dm) => `<span><i style="background:${dm.color}"></i>${dm.name}</span>`).join('')}</div>`;
    }

    /* 默认填今天日期，方便体验 */
    const todayFill = new Date();
    document.getElementById('birth-date').value =
      todayFill.getFullYear() + '-' + String(todayFill.getMonth() + 1).padStart(2, '0') + '-' + String(todayFill.getDate()).padStart(2, '0');

    ToneEngine.applyBadge();
  </script>
  <script src="../js/knowledge-base.js"></script>
  <script src="../js/ask-panel.js"></script>

<script>
/* 全局错误浮层（开发期调试：任何报错直接可见，避免"没反应/白屏"） */
(function(){
  var shown = false;
  window.addEventListener("error", function(e){
    if (shown) return; shown = true;
    var d = document.createElement("div");
    d.style.cssText = "position:fixed;left:12px;bottom:12px;z-index:99999;max-width:420px;background:#2a1210;border:1px solid #c44a3c;color:#f2d8d4;font-size:12px;line-height:1.7;padding:10px 14px;border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.5);font-family:monospace;white-space:pre-wrap;";
    d.textContent = "⚠ 页面脚本错误：" + (e.message || "unknown") + " | " + (e.filename || "") + ":" + (e.lineno || "");
    document.body.appendChild(d);
  });
})();
</script>

  <script>
    function openAskPanel() {
      if (window.AskPanel && typeof window.AskPanel.toggle === 'function') {
        window.AskPanel.toggle();
      } else {
        var s = document.createElement('script');
        s.src = '../js/ask-panel.js';
        s.onload = function() { if (window.AskPanel) window.AskPanel.toggle(); };
        document.body.appendChild(s);
      }
    }
    // 高亮当前页 tab
    (function(){
      try {
        var path = location.pathname;
        var fileName = path.split('/').pop();
        var tabs = document.querySelectorAll('#bottom-tab .tab-item');
        tabs.forEach(function(a){
          if (a.href && fileName && a.href.indexOf(fileName) >= 0) {
            tabs.forEach(function(x){ x.classList.remove('active'); });
            a.classList.add('active');
          }
        });
      } catch(e) {}
    })();
  </script>


  <script>
    function openTopbarMentor(system) {
      if (window.AskPanel && typeof window.AskPanel.open === 'function') {
        window.AskPanel.open(system);
      } else {
        var s = document.createElement('script');
        s.src = '../js/ask-panel.js';
        s.onload = function() { if (window.AskPanel) window.AskPanel.open(system); };
        document.body.appendChild(s);
      }
    }
    function renderTopbarAvatars() {
      if (!window.AskPanel || !window.AskPanel._avatarSvg) return;
      var w = document.getElementById('tb-avatar-w');
      var e = document.getElementById('tb-avatar-e');
      if (w) w.innerHTML = window.AskPanel._avatarSvg('astrology');
      if (e) e.innerHTML = window.AskPanel._avatarSvg('bazi');
    }
    if (window.AskPanel) renderTopbarAvatars();
    window.addEventListener('load', renderTopbarAvatars);
  </script>
</body>
