<!DOCTYPE html>
<html lang="zh-CN" data-theme="ziwei">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23110d18'/><text x='32' y='45' font-size='40' font-weight='800' text-anchor='middle' fill='%23d4af6e' font-family='Arial, sans-serif'>K</text></svg>">
  <title>紫微斗数 — KiXs · 命术</title>
  <link rel="stylesheet" href="base.css">
  <style>
    .palace { transition: all 0.3s; }
    .palace .p-title .sihua-tag {
      font-size: 10px; padding: 1px 7px; border-radius: 99px;
      border: 1px solid var(--line); margin-left: 2px;
    }
    .sihua-lu { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 50%, transparent) !important; }
    .sihua-quan { color: var(--danger); }
    .sihua-ke { color: var(--accent-2); }
    .sihua-ji { color: var(--ink-3); }
    .demo-note {
      margin: 14px 0; padding: 12px 18px; border-radius: 12px;
      border: 1px dashed var(--danger); font-size: 12.5px; color: var(--ink-2);
    }
  </style>
</head>
<body class="grain">
  <div class="starfield"></div>

  <header class="topbar">
    <a class="logo" href="index.html"><span class="seal-mini">K</span>KiXs</a>
    
    <!-- 顶栏师傅：玄机子（中国体系） -->
    <div class="topbar-mentors" id="topbar-mentors">
      <div class="tb-mentor east" onclick="openTopbarMentor('bazi')" title="玄机子 · 玄学大师">
        <span class="tb-avatar" id="tb-avatar-e"></span>
      </div>
    </div>
    <nav class="nav">
      <span class="crumb"><a href="ming-shu.html">命术</a></span>
      <a href="bazi.html">八字</a>
      <a href="ziwei.html" class="active">紫微</a>
      <a href="astrology.html">星盘</a>
      <span class="night-badge hidden"><span class="dot"></span><span class="label-text">夜语模式</span></span>
    </nav>
  </header>

  <section class="hero">
    <div class="kicker">Ziwei Doushu · 命术</div>
    <h1>紫微斗数</h1>
    <p class="sub">命宫为枢，十二宫布阵，星曜庙旺，四化流转。看格局与阶段运程。</p>
    <div class="meta-line" style="color:var(--danger);">精度声明：本页为演示框架——十二宫框架与星曜排布为示意数据；精确排盘需接入专业算法引擎（iztro-py）</div>
  </section>

  <main class="wrap">
    <div class="reading">
      <div class="label">布盘 · 出生信息</div>
      <div class="form-grid">
        <div class="form-row">
          <label>出生日期（公历）</label>
          <input class="input" type="date" id="birth-date" max="2099-12-31">
        </div>
        <div class="form-row">
          <label>出生时辰</label>
          <select class="input" id="shichen">
            <option value="">— 请选择时辰 —</option>
            <option value="子">子时 23:00–01:00</option>
            <option value="丑">丑时 01:00–03:00</option>
            <option value="寅">寅时 03:00–05:00</option>
            <option value="卯">卯时 05:00–07:00</option>
            <option value="辰">辰时 07:00–09:00</option>
            <option value="巳">巳时 09:00–11:00</option>
            <option value="午">午时 11:00–13:00</option>
            <option value="未">未时 13:00–15:00</option>
            <option value="申">申时 15:00–17:00</option>
            <option value="酉">酉时 17:00–19:00</option>
            <option value="戌">戌时 19:00–21:00</option>
            <option value="亥">亥时 21:00–23:00</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <label>性别</label>
        <div class="gender-pick">
          <div class="gender-opt sel" data-g="男" onclick="pickG(this)">乾造 · 男</div>
          <div class="gender-opt" data-g="女" onclick="pickG(this)">坤造 · 女</div>
        </div>
      </div>
      <div style="text-align:center;">
        <button class="btn" id="btn-cast">布盘看命</button>
      </div>
    </div>

    <div id="result" style="display:none;"></div>
  </main>

  <div class="disclaimer">⚠️ 本回复由 AI 生成，紫微斗数为传统命理的象征推演，<b>仅供娱乐参考</b>。当前页面为演示框架（星曜示意排布），精确排盘请接入专业算法引擎。不构成医疗、法律、财务或投资建议。</div>

  <footer class="footer">KiXs · 紫微 — 星辰布阵 · 格局在我</footer>

  <script src="tone-engine.js"></script>
  <script src="ziwei.js"></script>
  <script>
    let gender = '男';
    function pickG(el) {
      gender = el.dataset.g;
      document.querySelectorAll('.gender-opt').forEach((e) => e.classList.remove('sel'));
      el.classList.add('sel');
    }

    document.getElementById('btn-cast').onclick = () => {
      const dateVal = document.getElementById('birth-date').value;
      const sc = document.getElementById('shichen').value;
      if (!dateVal || !sc) { alert('请填写出生日期与时辰（紫微斗数需完整年月日时方可布盘）。'); return; }
      const chart = ZiweiEngine.demoChart(`${dateVal} ${sc}时（${gender === '男' ? '乾造' : '坤造'}）`);
      AskPanel.setChart({ chart });
      const el = document.getElementById('result');
      el.style.display = 'block';
      el.className = 'result-enter';

      const sihuaCls = { 禄: 'sihua-lu', 权: 'sihua-quan', 科: 'sihua-ke', 忌: 'sihua-ji' };
      el.innerHTML = `
        <div class="demo-note">⚠️ 演示模式：以下十二宫框架完整，星曜分布为<b>示意数据</b>，仅供理解盘面形态与产品交互。精确命盘（命宫/身宫/五行局/安星/四化）需接入专业算法引擎。</div>
        <div class="reading">
          <div class="label">十二宫盘 · ${chart.birthText}</div>
          <div class="palace-grid">
            <div class="palace center">
              <div>
                <div class="p-title" style="justify-content:center;margin-bottom:6px;">命 盘</div>
                <div style="font-size:12px;color:var(--ink-2);line-height:2;">${chart.birthText}<br><b style="color:var(--accent);">演示数据</b></div>
              </div>
            </div>
            ${chart.palaces.slice(0, 11).map((p) => `
              <div class="palace">
                <div class="p-title">${p.name}
                  ${p.sihua.map((k) => `<span class="sihua-tag ${sihuaCls[k]}">化${k}</span>`).join('')}
                </div>
                <div class="p-body">
                  ${p.stars.map((s) => `<span class="s">${s}</span>`).join('') || '<span class="s" style="color:var(--ink-3);">空宫 · 借星</span>'}
                </div>
              </div>`).join('')}
          </div>
          <div style="font-size:12px;color:var(--ink-3);margin-top:10px;">四化图例：<span style="color:var(--accent);">禄=金</span> · <span style="color:var(--danger);">权=玫</span> · <span style="color:var(--accent-2);">科=青</span> · <span style="color:var(--ink-3);">忌=灰</span></div>
        </div>
        <div class="reading">
          <div class="label">解读</div>
          <div class="txt">${ZiweiEngine.interpret(chart).replace(/\n/g, '<br>')}</div>
        </div>`;
      el.scrollIntoView({ behavior: 'smooth' });
    };

    const today = new Date();
    document.getElementById('birth-date').value =
      today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');

    ToneEngine.applyBadge();
  </script>
  <script src="knowledge-base.js"></script>
  <script src="ask-panel.js"></script>
  <script>AskPanel.init({ system: 'ziwei', hint: '四化是什么' });</script>
<script>
/* 全局错误浮层（开发期调试：任何报错直接可见，避免"没反应/白屏"） */
(function(){
  var shown = false;
  window.addEventListener("error", function(e){
    if (shown) return; shown = true;
    var d = document.createElement("div");
    d.style.cssText = "position:fixed;left:12px;bottom:12px;z-index:99999;max-width:420px;background:#2a1210;border:1px solid #c44a3c;color:#f2d8d4;font-size:12px;line-height:1.7;padding:10px 14px;border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.5);font-family:monospace;white-space:pre-wrap;";
    d.textContent = "⚠ 页面脚本错误：" + (e.message || "unknown") + " | " + (e.filename || "") + ":" + (e.lineno || "");
    document.body.appendChild(d);
  });
})();
</script>

  <!-- iOS 风格底部 Tab Bar -->
  <nav class="bottom-tab" id="bottom-tab">
    <a href="index.html" class="tab-item" data-tab="home">
      <span class="tab-icon">⌂</span>
      <span class="tab-label">首页</span>
    </a>
    <a href="ming-shu.html" class="tab-item" data-tab="ming">
      <span class="tab-icon">命</span>
      <span class="tab-label">命术</span>
    </a>
    <a href="zhan-shu.html" class="tab-item" data-tab="zhan">
      <span class="tab-icon">占</span>
      <span class="tab-label">占术</span>
    </a>
    <a href="profile.html" class="tab-item" data-tab="profile">
      <span class="tab-icon">我</span>
      <span class="tab-label">我的</span>
    </a>
  </nav>
  <script>
    function openAskPanel() {
      if (window.AskPanel && typeof window.AskPanel.toggle === 'function') {
        window.AskPanel.toggle();
      } else {
        var s = document.createElement('script');
        s.src = '../js/ask-panel.js';
        s.onload = function() { if (window.AskPanel) window.AskPanel.toggle(); };
        document.body.appendChild(s);
      }
    }
    // 高亮当前页 tab
    (function(){
      try {
        var path = location.pathname;
        var fileName = path.split('/').pop();
        var tabs = document.querySelectorAll('#bottom-tab .tab-item');
        tabs.forEach(function(a){
          if (a.href && fileName && a.href.indexOf(fileName) >= 0) {
            tabs.forEach(function(x){ x.classList.remove('active'); });
            a.classList.add('active');
          }
        });
      } catch(e) {}
    })();
  </script>


  <script>
    function openTopbarMentor(system) {
      if (window.AskPanel && typeof window.AskPanel.open === 'function') {
        window.AskPanel.open(system);
      } else {
        var s = document.createElement('script');
        s.src = '../js/ask-panel.js';
        s.onload = function() { if (window.AskPanel) window.AskPanel.open(system); };
        document.body.appendChild(s);
      }
    }
    function renderTopbarAvatars() {
      if (!window.AskPanel || !window.AskPanel._avatarSvg) return;
      var w = document.getElementById('tb-avatar-w');
      var e = document.getElementById('tb-avatar-e');
      if (w) w.innerHTML = window.AskPanel._avatarSvg('astrology');
      if (e) e.innerHTML = window.AskPanel._avatarSvg('bazi');
    }
    if (window.AskPanel) renderTopbarAvatars();
    window.addEventListener('load', renderTopbarAvatars);
  </script>
</body>
</html>
